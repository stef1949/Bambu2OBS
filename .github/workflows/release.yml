name: Release

# Pushing a tag such as v0.3.0 publishes a release, and a suffix such as
# v0.3.0-rc.1 marks it as a prerelease. Running this by hand makes a draft
# instead, which creates its tag on this commit only when it is published.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the draft release, such as v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag, version, and changelog
        id: release
        shell: pwsh
        run: ./native/scripts/prepare-release.ps1 -Tag $env:RELEASE_TAG

  build:
    needs: check
    uses: ./.github/workflows/native-package.yml
    with:
      fresh-dependencies: true

  # Only this job can write to the repository, and it builds nothing.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Bambu-Printer-Overlay-Windows-x64
          path: release

      - name: Verify the checksums and write the release notes
        shell: pwsh
        run: ./native/scripts/prepare-release.ps1 -Tag $env:RELEASE_TAG -ReleaseRoot release -NotesPath "$env:RUNNER_TEMP/release-notes.md"

      - name: Refuse to replace a release or build for a different commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already has a release. Delete it first, or use a new tag."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha 2> /dev/null || true)
            if [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::$RELEASE_TAG already points at $tag_commit, but this build is $GITHUB_SHA."
              exit 1
            fi
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            flags+=(--draft --target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bambu Printer Overlay $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"

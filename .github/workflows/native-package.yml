name: Native OBS package

on:
  push:
    branches: [master, main]
    paths:
      - 'native/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/native-package.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/native-package.yml'
  workflow_call:
    inputs:
      fresh-dependencies:
        description: Download the pinned dependencies rather than trust a cache
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned OBS development dependencies
        if: ${{ !inputs.fresh-dependencies }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/.deps
          key: obs-native-windows-x64-${{ hashFiles('native/buildspec.json') }}

      - name: Configure native plugin
        working-directory: native
        run: cmake --preset windows-x64

      - name: Build native plugin
        working-directory: native
        run: cmake --build --preset windows-x64

      - name: Run libobs and native-core tests
        working-directory: native
        run: ctest --preset windows-x64

      - name: Create and validate installer artifacts
        shell: powershell
        run: .\native\scripts\package-windows.ps1 -Configuration Release -InnoCompiler "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Install and uninstall the installer
        timeout-minutes: 5
        shell: powershell
        run: .\native\scripts\test-installer.ps1 -ReleaseRoot release

      - name: Upload unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bambu-Printer-Overlay-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.sha256
          if-no-files-found: error

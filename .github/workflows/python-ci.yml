name: Python CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint Python sources
        run: python -m ruff check src tests

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate dependency graph
        run: python -m pip check

      - name: Configure native core tests
        run: cmake -S native -B native/build -DBAMBU_OVERLAY_BUILD_PLUGIN=OFF -DBAMBU_OVERLAY_BUILD_TESTS=ON

      - name: Build native core tests
        run: cmake --build native/build --config Release

      - name: Run native core tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Check patch whitespace
        run: git diff --check
